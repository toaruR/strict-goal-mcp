name: test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  strict-goal-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: strict-goal/server
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm test
